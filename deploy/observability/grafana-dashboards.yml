# Grafana dashboard provisioning.
#
# Dashboards are files in this repository, not objects in Grafana's database. The
# grafana-data volume holds users and preferences; losing it must not lose the
# dashboard an operator opens during an incident, which is why docs/operations.md
# rates that volume as "re-provision" rather than as data.
#
# The dashboards themselves live in a DIFFERENT directory from this file. Grafana
# parses every file under `options.path` as a dashboard, so a provider config sitting
# in the same directory is read as one, fails, and logs an error on every startup.
apiVersion: 1

providers:
  - name: observatory
    orgId: 1
    # A named folder keeps provisioned dashboards from mixing with anything a person
    # imports by hand.
    folder: Observatory
    type: file
    # Provisioned dashboards are read-only in the UI on purpose: an edit saved in the
    # browser is silently reverted on the next provisioning sweep, and the operator who
    # made it has no way to tell. Change the JSON in git instead.
    allowUiUpdates: false
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
