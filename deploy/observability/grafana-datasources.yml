apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # Pinned, because the provisioned dashboard references its datasource by uid. Left
    # unset, Grafana generates one per install and every panel comes up "Datasource not
    # found" on any machine but the one the JSON was exported from.
    uid: observatory-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
