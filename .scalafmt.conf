version = 3.11.4
runner.dialect = scala3
maxColumn = 120

# Indentation-based syntax is the house style. These rewrites enforce it, so a
# brace-style regression is corrected by `sbt fmt` rather than caught in review.
rewrite.scala3.convertToNewSyntax = true
rewrite.scala3.removeOptionalBraces = yes
rewrite.rules = [RedundantBraces, RedundantParens, SortModifiers, Imports]
rewrite.imports.sort = scalastyle
rewrite.imports.expand = true
rewrite.redundantBraces.stringInterpolation = true

indent.main = 2
indent.significant = 2
indent.callSite = 2
indent.defnSite = 2
indent.extendSite = 4

align.preset = some
align.stripMargin = true
assumeStandardLibraryStripMargin = true

danglingParentheses.preset = true
newlines.source = keep
newlines.beforeMultiline = keep

docstrings.style = SpaceAsterisk
docstrings.oneline = fold
docstrings.wrap = yes

literals.long = Upper
literals.hexDigits = Lower

project.git = true
project.includeFilters = [".*\\.scala$", ".*\\.sbt$"]
