name: Scala CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - uses: sbt/setup-sbt@v1

      # `verify` is fmtCheck + headerCheck + test, so formatting drift or a
      # missing licence header fails here rather than in review.
      - name: Verify
        run: sbt -batch verify

  package:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - uses: sbt/setup-sbt@v1

      # Stages the images without publishing: proves packaging still works on
      # every push without needing registry credentials.
      - name: Stage Docker images
        run: sbt -batch ferrite/Docker/stage cobalt/Docker/stage wolfram/Docker/stage
