# cobalt — the Kafka consumer.
#
# Every value is overridable by an environment variable so the image is configured at
# deploy time and never rebuilt for an environment change. The `database` namespace is
# supplied by modules/persistence's reference.conf and overridden by DATABASE_*.
cobalt {

  # Operational surface only: /metrics and the two health probes. cobalt has no
  # business endpoints — events arrive over Kafka (ADR §1).
  server {
    host = "0.0.0.0"
    host = ${?HTTP_HOST}
    port = 8080
    port = ${?HTTP_PORT}
  }

  consumer {
    bootstrap-servers = "localhost:9092"
    bootstrap-servers = ${?KAFKA_BOOTSTRAP_SERVERS}

    topic = "events.cloudevents.v1"
    topic = ${?KAFKA_TOPIC}

    dlq-topic = "events.cloudevents.v1.dlq"
    dlq-topic = ${?KAFKA_DLQ_TOPIC}

    group-id = "cobalt-cloudevents-v1"
    group-id = ${?KAFKA_GROUP_ID}

    # ADR §4.3: groupedWithin(500, 250ms). The window is the pipeline's latency floor
    # when traffic is sparse, the size is the largest batch a poison record can force
    # the isolation search to bisect.
    batch-size = 500
    batch-size = ${?CONSUMER_BATCH_SIZE}
    batch-window = 250 millis
    batch-window = ${?CONSUMER_BATCH_WINDOW}

    # Whole-batch retries before the poison-isolation bisection starts. These exist to
    # ride out a connection blip; the bisection exists to find a row the database will
    # never accept. Conflating them turns a brief outage into a DLQ full of good events.
    write-attempts = 3
    write-attempts = ${?CONSUMER_WRITE_ATTEMPTS}
    retry-delay = 200 millis
    retry-delay = ${?CONSUMER_RETRY_DELAY}

    # Offset aggregation. Safe to batch precisely because the committer is downstream of
    # the write: every offset it holds is already durable, so delay only widens the
    # replay window after a crash and can never lose anything.
    commit-max-batch = 1000
    commit-max-interval = 5 seconds
    commit-parallelism = 1

    # How long a drain may take before shutdown gives up on the in-flight batch.
    drain-timeout = 30 seconds
    drain-timeout = ${?CONSUMER_DRAIN_TIMEOUT}

    # Free-form consumer overrides (security, DNS, tuning). bootstrap.servers, group.id,
    # enable.auto.commit and auto.offset.reset are applied afterwards and always win.
    properties {}
  }

  # Bounded exponential backoff for the consumer's RestartSource (ADR §4.3). Bounded on
  # purpose: an unbounded restart loop against a broker that is never coming back looks
  # exactly like a healthy consumer with no traffic.
  restart {
    min-backoff = 1 second
    max-backoff = 30 seconds
    random-factor = 0.2
    max-restarts = 50
    max-restarts-within = 10 minutes
  }

  # Consumer lag, from an AdminClient rather than the consumer's own records-lag-max
  # (ADR §7.1). Two admin round trips per interval per replica, so this is measured in
  # tens of seconds: lag is a trend, and sampling it faster than Prometheus scrapes it
  # buys nothing but broker load.
  lag {
    refresh-interval = 20 seconds
    refresh-interval = ${?LAG_REFRESH_INTERVAL}
    request-timeout = 5 seconds
    request-timeout = ${?LAG_REQUEST_TIMEOUT}
  }
}

pekko {
  # Route Pekko's and the Kafka connector's own logging into the same Logback JSON
  # pipeline as everything else (ADR §7.3), instead of its stdout logger.
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"
  loglevel = "INFO"

  coordinated-shutdown {
    # SIGTERM must drain the in-flight batch rather than drop it.
    run-by-jvm-shutdown-hook = on
    # Long enough for a full batch write plus its commit; short enough that a wedged
    # drain cannot hold a rolling deploy open indefinitely.
    phases.service-requests-done.timeout = 40 seconds
  }
}
