# redprime-service
#
# Overrides only; Play's reference configuration supplies the rest.

play.modules.enabled += "io.kzonix.redprime.routes.RouteModule"
play.modules.enabled += "io.kzonix.redprime.client.ClientModule"
play.modules.enabled += "io.kzonix.redprime.tasks.TasksModule"
play.modules.enabled += "io.kzonix.redprime.actors.ActorConfigurationModule"

play.http.secret.key = "development-only-secret-do-not-use-in-production"
play.http.secret.key = ${?APPLICATION_SECRET}

# API-only service: no cookie session, no browser-submitted forms.
play.filters.disabled += "play.filters.csrf.CSRFFilter"

play.filters.hosts.allowed = ["localhost", "127.0.0.1", ".local"]
play.filters.hosts.allowed = ${?ALLOWED_HOSTS}

play.ws.cache.enabled = false

# Credentials are secrets: supply them from the environment, never from a file
# committed to the repository. Startup fails fast if any are missing.
reddit.client {
  authorizeUri = "https://www.reddit.com/api/v1/access_token"
  authorizeUri = ${?REDDIT_AUTHORIZE_URI}
  clientId     = ${?REDDIT_CLIENT_ID}
  clientSecret = ${?REDDIT_CLIENT_SECRET}
  username     = ${?REDDIT_USERNAME}
  password     = ${?REDDIT_PASSWORD}
}
