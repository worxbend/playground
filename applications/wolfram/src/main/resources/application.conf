# wolfram — the CloudEvents ingestion API.
#
# Every value here is overridable by an environment variable so that the image is
# configured at deploy time and never rebuilt for an environment change.
wolfram {

  server {
    host = "0.0.0.0"
    host = ${?HTTP_HOST}
    port = 8080
    port = ${?HTTP_PORT}
  }

  # Bearer-token verification for every /v1 operation.
  #
  # `enabled` defaults to TRUE and there is no key default. A security layer whose
  # default state is "off" is one that ships off, because nothing fails when it is:
  # the tests pass, the smoke test passes, and the first evidence is an
  # unauthenticated write in production. Running without authentication therefore
  # has to be said out loud, and running with it requires a key — a service
  # configured to verify but given nothing to verify against refuses to boot rather
  # than accepting everything.
  auth {
    enabled = true
    enabled = ${?AUTH_ENABLED}

    # HS256/HS384/HS512 (symmetric, needs `secret`) or RS256/RS384/RS512
    # (asymmetric, needs `public-key`). The token's own `alg` header is checked
    # against this and never trusted: accepting the header's choice is the
    # `alg: none` family of attacks, and the RSA-public-key-as-HMAC-secret
    # confusion that follows from letting a caller pick the algorithm's family.
    algorithm = "HS256"
    algorithm = ${?AUTH_ALGORITHM}

    # Exactly one of these, matching `algorithm`. Both absent with `enabled = true`
    # is a boot failure naming the field.
    secret = ${?AUTH_SECRET}
    public-key = ${?AUTH_PUBLIC_KEY}

    # When set, `iss` must equal this and `aud` must contain it. Left unset the
    # claims are not checked — which is correct for a single-issuer deployment and
    # wrong the moment a second issuer can reach this port.
    issuer = ${?AUTH_ISSUER}
    audience = ${?AUTH_AUDIENCE}

    # The scope a token must carry to publish. Empty disables the check while
    # leaving signature verification on.
    required-scope = "events:write"
    required-scope = ${?AUTH_REQUIRED_SCOPE}

    # Tolerance on `exp` and `nbf` for clock skew between the issuer and this host.
    # Small on purpose: this is the window in which a revoked token still works.
    leeway = 30 seconds
    leeway = ${?AUTH_LEEWAY}
  }

  # Rejection thresholds. See IngestConfig for why none of these clamp into range.
  ingest {
    # 1 MiB. Below Kafka's default message.max.bytes (1 MiB + overhead) on purpose:
    # the API must be the thing that says no, not the broker.
    max-event-bytes = 1048576
    max-event-bytes = ${?INGEST_MAX_EVENT_BYTES}

    max-batch-events = 256
    max-batch-events = ${?INGEST_MAX_BATCH_EVENTS}

    # ADR §12.4: reject `time` more than 24 h ahead or 90 d behind the ingest clock.
    max-future-skew = 24 hours
    max-future-skew = ${?INGEST_MAX_FUTURE_SKEW}
    max-past-skew = 90 days
    max-past-skew = ${?INGEST_MAX_PAST_SKEW}
  }

  publisher {
    bootstrap-servers = "localhost:9092"
    bootstrap-servers = ${?KAFKA_BOOTSTRAP_SERVERS}

    topic = "events.cloudevents.v1"
    topic = ${?KAFKA_TOPIC}

    # Kafka's default is 60 s, which parks the calling thread for a minute when the
    # broker is unreachable. Two seconds is long enough to ride out a leader election
    # and short enough that readiness flips before a load balancer notices.
    max-block = 2 seconds
    max-block = ${?KAFKA_MAX_BLOCK}

    # delivery-timeout bounds the whole send including retries; request-timeout bounds
    # one round trip. Kafka requires delivery >= linger + request.
    delivery-timeout = 10 seconds
    delivery-timeout = ${?KAFKA_DELIVERY_TIMEOUT}
    request-timeout = 5 seconds
    request-timeout = ${?KAFKA_REQUEST_TIMEOUT}

    # How long graceful shutdown waits for the accumulator to drain.
    close-timeout = 10 seconds
    close-timeout = ${?KAFKA_CLOSE_TIMEOUT}

    # Explicit backpressure: sends beyond this depth are shed as 503 rather than queued.
    queue-capacity = 1024
    queue-capacity = ${?KAFKA_QUEUE_CAPACITY}

    # Free-form producer overrides (security, DNS, tuning). Merged *under* the
    # correctness settings in KafkaCodecs.producerDefaults, which always win.
    properties {}
  }
}
