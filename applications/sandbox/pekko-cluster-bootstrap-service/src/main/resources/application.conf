# pekko-cluster-bootstrap-service

pekko {
  loggers        = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  loglevel       = "INFO"
  loglevel       = ${?LOG_LEVEL}
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"

  actor.provider = "cluster"

  remote.artery.canonical {
    hostname = "127.0.0.1"
    hostname = ${?CLUSTER_HOSTNAME}
    port     = 25520
    port     = ${?CLUSTER_PORT}
  }

  cluster {
    # Single-node default so the module runs standalone; supply the real seeds
    # through CLUSTER_SEED_NODES in any deployed environment.
    seed-nodes = ["pekko://hraesvelgr@127.0.0.1:25520"]
    seed-nodes = ${?CLUSTER_SEED_NODES}

    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
  }
}
