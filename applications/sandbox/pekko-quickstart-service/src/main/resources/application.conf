# pekko-quickstart-service
#
# Overrides only. This file previously inlined the whole Alpakka Kafka reference
# configuration under an `akka { }` root, which no longer applies under Pekko.

pekko {
  loggers          = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  loglevel         = "INFO"
  loglevel         = ${?LOG_LEVEL}
  logging-filter   = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"

  kafka.consumer {
    kafka-clients {
      bootstrap.servers = "localhost:9092"
      bootstrap.servers = ${?KAFKA_BOOTSTRAP_SERVERS}
    }
  }
}

quickstart {
  consumer {
    group-id = "quickstart"
    group-id = ${?KAFKA_GROUP_ID}
    topic    = "backblaze_smart"
    topic    = ${?KAFKA_TOPIC}
  }
}
