# index-service
#
# Overrides only. The previous file inlined a verbatim copy of Play's reference
# filter configuration, so every upstream default change had to be merged by hand.

play.modules.enabled += "io.kzonix.index.routes.RouteModule"

# Must be supplied in every non-development environment.
play.http.secret.key = "development-only-secret-do-not-use-in-production"
play.http.secret.key = ${?APPLICATION_SECRET}

play.filters.enabled += "io.kzonix.index.filters.DeploymentEnvIdFilter"

# API-only service: no cookie session and no browser-submitted forms, so CSRF
# protection guards nothing. Re-enable it if a browser client is ever added.
play.filters.disabled += "play.filters.csrf.CSRFFilter"

play.filters.hosts.allowed = ["localhost", "127.0.0.1", ".local"]
play.filters.hosts.allowed = ${?ALLOWED_HOSTS}

# Surfaced in the X-Container-Id response header; a random UUID when unset.
docker.env = ${?DEPLOYMENT_ENV_ID}
