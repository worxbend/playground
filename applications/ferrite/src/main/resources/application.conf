# ferrite — overrides only; Play's reference configuration and modules/persistence' reference.conf supply the rest.

# Routing is a Router class, not a compiled conf/routes file (ADR-0000 section 8.1). `Compile/routes/sources := Nil`
# and the absence of a routes file mean no `router.Routes` is generated and SIRD is the only routing mechanism.
play.http.router = "io.kzonix.ferrite.routing.AppRouter"

play.modules.enabled += "io.kzonix.ferrite.wiring.FerriteModule"

# Exactly one component times each HTTP request and it is always Micrometer (ADR section 7.1), so that
# http.server.requests carries identical names and tags in all three services and one dashboard works everywhere.
play.filters.enabled += "io.kzonix.ferrite.web.MetricsFilter"

# Must be supplied in every non-development environment.
play.http.secret.key = "development-only-secret-do-not-use-in-production"
play.http.secret.key = ${?APPLICATION_SECRET}

# CSRF is ENABLED. This service serves a browser form (the filter bar) and htmx requests that carry a token, so the
# `play.filters.disabled += CSRFFilter` line that used to live here has been removed rather than commented out — a
# disabled security filter with a comment explaining why is a filter that stays disabled.
#
# The token reaches every htmx request through one `hx-headers` attribute on <body> (ADR section 8.4). `Csrf-Token`
# is Play's default header name, so nothing here has to name it.

# The allowed-hosts list is supplied as ONE comma-separated string and split by io.kzonix.ferrite.wiring.AllowedHosts,
# because `play.filters.hosts.allowed = ${?ALLOWED_HOSTS}` cannot work: Play types that key as a list, a HOCON
# environment substitution always yields a string, and the mismatch is a boot failure that only ever happens once the
# variable is set — so it passes every development run and fails every deployment. That full argument, and why the
# indexed-system-property alternative was rejected, is in `AllowedHosts`.
ferrite.allowed-hosts = "localhost,127.0.0.1,.local"
ferrite.allowed-hosts = ${?ALLOWED_HOSTS}

# Play's module binds AllowedHostsConfig from `play.filters.hosts.allowed`; FerriteModule binds it from the key above.
# Guice rejects two bindings for one type, so Play's has to go rather than merely be overridden. The FILTER itself
# stays enabled — this swaps where its configuration comes from, and nothing else.
play.modules.disabled += "play.filters.hosts.AllowedHostsModule"

# Play ships no Content-Security-Policy by default. htmx and Alpine are served from this origin as ordinary script
# files, so a same-origin policy costs nothing. 'unsafe-eval' is required by Alpine 3, which compiles its `x-`
# expressions with `new Function`; that is the documented trade for using it, and it is exactly why ADR section 8.4
# confines Alpine to presentational state and never lets it fetch or render user data.
play.filters.headers.contentSecurityPolicy = "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self'; img-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

database {
  # ferrite READS ONLY and never runs a migration — see io.kzonix.ferrite.wiring.Databases for why a web replica
  # must not apply DDL on boot.
  read.read-only = true

  # The dispatcher every blocking JDBC call runs on.
  #
  # `fixed-pool-size` MUST equal `database.read.maximum-pool-size` (8, from modules/persistence' reference.conf).
  # More threads than connections moves the queue from the dispatcher — where it is configured and observable — into
  # HikariCP, where waiting surfaces as a connectionTimeout exception rather than as backpressure. Fewer threads
  # means connections that can never be used. io.kzonix.ferrite.search.SearchExecutionContext carries the full
  # argument, including why this is neither Play's default dispatcher nor a virtual-thread executor.
  search-dispatcher {
    type = Dispatcher
    executor = "thread-pool-executor"
    thread-pool-executor {
      fixed-pool-size = 8
    }
    # One task per hand-off. These tasks block for milliseconds; a larger throughput only delays the first of them.
    throughput = 1
  }
}
