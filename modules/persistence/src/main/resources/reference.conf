# Defaults for modules/persistence. Overridden by each service's application.conf,
# and by the DATABASE_* environment variables so a container needs no config file.
#
# The two pools of ADR-0000 section 5 are separate on purpose: a runaway search must
# not be able to starve ingestion of connections, and vice versa. Each pool's
# maximum-pool-size is also the size of the matching CustomExecutionContext in the
# service that owns it - if they differ, the surplus threads simply block in
# getConnection and the pool's own timeout stops being the thing that sheds load.
database {
  jdbc-url = "jdbc:postgresql://localhost:5432/observatory"
  jdbc-url = ${?DATABASE_URL}
  username = "observatory"
  username = ${?DATABASE_USER}
  password = ""
  password = ${?DATABASE_PASSWORD}

  # Search: small, read-only, and hard-capped by a server-side statement timeout.
  # A client-side query timeout would leave the backend running, which is exactly
  # the failure mode this pool exists to bound.
  read {
    pool-name = "observatory-read"
    maximum-pool-size = 8
    minimum-idle = 2
    connection-timeout = 3s
    idle-timeout = 5m
    max-lifetime = 25m
    validation-timeout = 2s
    read-only = true
    connection-init-sql = "SET statement_timeout = '2s'"
  }

  # Ingest: writes arrive in batches of up to 500 from one stream stage, so a small
  # pool is enough and a large one only adds lock contention on the same partitions.
  write {
    pool-name = "observatory-write"
    maximum-pool-size = 6
    minimum-idle = 2
    connection-timeout = 5s
    idle-timeout = 5m
    # Under the 30m default of most proxies and Postgres idle_session_timeout setups,
    # so connections are recycled by us rather than reset under us mid-statement.
    max-lifetime = 25m
    validation-timeout = 2s
    read-only = false
  }
}
