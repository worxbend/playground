site_name: playground event observatory
site_description: A CloudEvents observatory for smart-home and IoT telemetry
repo_url: https://github.com/worxbend/playground
edit_uri: edit/main/docs/

# MkDocs Material rather than an sbt doc-site plugin: neither laika-sbt,
# sbt-site nor sbt-ghpages publishes an sbt 2 artifact (see ADR §3.1), so the
# Scala-native options are simply unavailable on this toolchain. Scaladoc is
# built separately by sbt and copied under /api.
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# MkDocs only reports a broken *anchor* at INFO by default, so `--strict` would
# not catch one. Raised to a warning: under --strict a stale `#section-slug` now
# fails CI exactly like a stale file path does.
validation:
  links:
    anchors: warn
    unrecognized_links: warn

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Overview: index.md
  - Services:
      - wolfram — ingestion API: services/wolfram.md
      - cobalt — Kafka consumer: services/cobalt.md
      - ferrite — web application: services/ferrite.md
  - Reference:
      - Event model: event-model.md
      - Database schema: data/schema.md
  - Running it:
      - Development: development.md
      - Operations: operations.md
  - Architecture:
      # Ordered by zoom level, which is the order somebody new should read them: the system, then the shapes it
      # moves, then how each service is assembled, then what happens over time. The decision record is last because
      # it answers "why is it like this" rather than "what is it", and that is the second question.
      - At a glance: architecture/overview.md
      - Shared types: architecture/domain.md
      - Service composition: architecture/services.md
      - Flows over time: architecture/flows.md
      - Class index: architecture/classes.md
      - Decision record: adr/0000-architecture.md
  - Maintaining it:
      # Separate from "Architecture" on purpose. The pages above answer "what is this and why"; this one answers
      # "I have to change it, where does the change go and what will it break" — a different question, asked by
      # somebody who is no longer new, and burying it under Architecture is how it goes unread.
      - Maintainer's handbook: architecture/maintainers.md
  - API docs:
      - Scaladoc: api/index.html
